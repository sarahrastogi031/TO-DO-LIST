<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To-Do List Application</title>
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<style>
:root{--bg:#f3f6fb;--card:#fff;--text:#1d2433;--muted:#6b7488;--accent:#2563eb;--line:#e2e8f2;--danger:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#182033;--text:#e8ecf6;--muted:#97a1b8;--accent:#6d9cff;--line:#2a3550;--danger:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#182033;--text:#e8ecf6;--muted:#97a1b8;--accent:#6d9cff;--line:#2a3550;--danger:#f87171;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:24px 14px}
.app{width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{margin:0 0 4px;font-size:1.5rem}
.sub{color:var(--muted);margin:0 0 18px;font-size:.9rem}
form{display:flex;gap:8px}
input[type=text]{flex:1;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:1rem}
button{cursor:pointer;border:0;border-radius:8px;font-size:.95rem}
.add{background:var(--accent);color:#fff;padding:0 18px;font-weight:600}
.filters{display:flex;gap:6px;margin:16px 0 8px}
.filters button{background:transparent;border:1px solid var(--line);color:var(--muted);padding:6px 12px}
.filters button.on{background:var(--accent);border-color:var(--accent);color:#fff}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line)}
li span{flex:1;word-break:break-word}
li.done span{text-decoration:line-through;color:var(--muted)}
li input{width:18px;height:18px;accent-color:var(--accent)}
.del{background:transparent;color:var(--danger);padding:4px 8px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font-size:.88rem}
.clear{background:transparent;color:var(--muted);text-decoration:underline}
.empty{color:var(--muted);text-align:center;padding:22px 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main class="app">
  <h1 style="display:flex;align-items:center;gap:10px"><img src="images/logo.svg" alt="Logo" width="36" height="36">To-Do List</h1>
  <p class="sub">Add, complete and delete tasks. Tasks are saved in your browser.</p>
  <form id="form">
    <input type="text" id="task" placeholder="What needs to be done?" maxlength="120" aria-label="New task" autocomplete="off">
    <button class="add" type="submit">Add task</button>
  </form>
  <div class="filters" id="filters">
    <button data-f="all" class="on">All</button>
    <button data-f="active">Active</button>
    <button data-f="done">Completed</button>
  </div>
  <ul id="list"></ul>
  <div class="foot"><span id="count"></span><button class="clear" id="clear">Clear completed</button></div>
</main>
<script>
var KEY="todo-tasks", tasks=[], filter="all";
try{ tasks=JSON.parse(localStorage.getItem(KEY))||[]; }catch(e){ tasks=[]; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(tasks)); }catch(e){} }
function render(){
  var list=document.getElementById("list"); list.innerHTML="";
  var shown=tasks.filter(function(t){return filter==="all"||(filter==="done"?t.done:!t.done);});
  if(!shown.length){ list.innerHTML='<li class="empty" style="justify-content:center">No tasks here. Add one above.</li>'; }
  shown.forEach(function(t){
    var li=document.createElement("li"); if(t.done) li.className="done";
    var cb=document.createElement("input"); cb.type="checkbox"; cb.checked=t.done; cb.setAttribute("aria-label","Mark complete");
    cb.onchange=function(){ t.done=cb.checked; save(); render(); };
    var sp=document.createElement("span"); sp.textContent=t.text;
    var d=document.createElement("button"); d.className="del"; d.textContent="Delete"; d.setAttribute("aria-label","Delete task");
    d.onclick=function(){ tasks=tasks.filter(function(x){return x!==t;}); save(); render(); };
    li.appendChild(cb); li.appendChild(sp); li.appendChild(d); list.appendChild(li);
  });
  var left=tasks.filter(function(t){return !t.done;}).length;
  document.getElementById("count").textContent=left+" task"+(left===1?"":"s")+" left";
}
document.getElementById("form").onsubmit=function(e){
  e.preventDefault(); var inp=document.getElementById("task"), v=inp.value.trim();
  if(!v) return; tasks.push({text:v,done:false}); inp.value=""; save(); render();
};
document.getElementById("filters").onclick=function(e){
  var f=e.target.getAttribute("data-f"); if(!f) return; filter=f;
  Array.prototype.forEach.call(this.children,function(b){ b.classList.toggle("on",b===e.target); }); render();
};
document.getElementById("clear").onclick=function(){ tasks=tasks.filter(function(t){return !t.done;}); save(); render(); };
render();
</script>
</body>
</html>
